<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e35a6" />
      <stop offset="100%" stop-color="#2a1668" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa5a15" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5bc7" />
      <stop offset="100%" stop-color="#4527a0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <g transform="translate(50, 45)">
    <rect x="25" y="15" width="240" height="90" rx="45" fill="url(#indigoGrad)" filter="url(#shadowLight)"/>
    <rect x="25" y="15" width="90" height="280" rx="45" fill="url(#indigoGrad)" filter="url(#shadowLight)"/>
    
    <rect x="25" y="205" width="240" height="90" rx="45" fill="url(#indigoGrad)" filter="url(#shadowLight)"/>
    
    <circle cx="185" cy="250" r="18" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#shadowLight)" />
    <circle cx="215" cy="250" r="18" fill="none" stroke="url(#orangeGrad)" stroke-width="8" filter="url(#shadowLight)" />
    
    <path d="M 203 250 A 18 18 0 0 0 174.6 238" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

    <rect x="5" y="110" width="265" height="90" rx="45" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    
    <polygon points="215,138 215,172 245,155" fill="#ffffff" filter="url(#shadowLight)" />
  </g>
</svg>
