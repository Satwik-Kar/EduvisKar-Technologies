<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="smoothShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="baseTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="baseLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="baseRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="midTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="midLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="midRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <linearGradient id="topTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="topLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F9FE"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="topRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="coreTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <g filter="url(#smoothShadow)">
    <polygon points="100,120 160,145 100,170 40,145" fill="url(#baseTop)" />
    <polygon points="40,145 100,170 100,190 40,165" fill="url(#baseLeft)" />
    <polygon points="100,170 160,145 160,165 100,190" fill="url(#baseRight)" />
  </g>

  <g filter="url(#smoothShadow)">
    <polygon points="100,75 160,100 100,125 40,100" fill="url(#midTop)" />
    <polygon points="40,100 100,125 100,145 40,120" fill="url(#midLeft)" />
    <polygon points="100,125 160,100 160,120 100,145" fill="url(#midRight)" />
    
    <path d="M 50,114 L 90,131" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 150,114 L 110,131" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g filter="url(#smoothShadow)">
    <polygon points="100,30 160,55 100,80 40,55" fill="url(#topTop)" />
    <polygon points="40,55 100,80 100,100 40,75" fill="url(#topLeft)" />
    <polygon points="100,80 160,55 160,75 100,100" fill="url(#topRight)" />
  </g>

  <g filter="url(#glow)">
    <polygon points="100,45 124,55 100,65 76,55" fill="url(#coreTop)" />
    <polygon points="76,55 100,65 100,69 76,59" fill="#0284C7" />
    <polygon points="100,65 124,55 124,59 100,69" fill="#0369A1" />
    
    <circle cx="100" cy="32" r="2.5" fill="#38BDF8" />
    <circle cx="100" cy="22" r="1.5" fill="#7DD3FC" />
    <path d="M 100,45 L 100,35" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>
</svg>
