services:
  app_prod_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduviskar_tech_prod_test
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local.docker
    environment:
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - eduviskar_tech_prod_test_net

networks:
  eduviskar_tech_prod_test_net:
    driver: bridge
