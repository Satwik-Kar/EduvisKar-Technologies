services:
  app_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: eduviskar_tech_dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local.docker
    environment:
      NODE_ENV: development
      PORT: 8081
      WATCHPACK_POLLING: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - eduviskar_tech_local_net

networks:
  eduviskar_tech_local_net:
    driver: bridge
