# HTTP to HTTPS Redirects
server {
    listen 80;
    listen [::]:80;
    server_name eduviskar.com www.eduviskar.com live.eduviskar.com www.live.eduviskar.com admin.eduviskar.com localhost;

    if ($host = admin.eduviskar.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = live.eduviskar.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.live.eduviskar.com) {
        return 301 https://live.eduviskar.com$request_uri;
    }
    if ($host = eduviskar.com) {
        return 301 https://eduviskar.com$request_uri;
    }
    if ($host = www.eduviskar.com) {
        return 301 https://eduviskar.com$request_uri;
    }
return 404;
}
