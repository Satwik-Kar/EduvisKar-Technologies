proxy_cache_path /var/cache/nginx/eduviskar levels=1:2 keys_zone=NEXT_CACHE:10m max_size=1g inactive=7d use_temp_path=off;

upstream main_cluster {
    server eduviskar_main:8081;
    keepalive 16;
}

upstream nextjs_cluster {
    server nextjs_1:3000;
    server nextjs_2:3000;
    keepalive 32;
}

upstream admin_cluster {
    server nextjs_admin:3005;
    keepalive 32;
}


# Main Application Server (Next.js)
server {
    server_name live.eduviskar.com www.live.eduviskar.com localhost;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    error_page 404 /404.html;
    proxy_intercept_errors on;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|bak|old|tmp|sql|php|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /admin {
        return 404;
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location ~* ^/(favicon\.ico|icon.*\.png|apple-touch-icon.*\.png|apple-icon.*\.png|icon\.svg|manifest\.webmanifest|manifest\.json)$ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location /_next/static/ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache NEXT_CACHE;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }


    location / {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    
    ssl_certificate /etc/letsencrypt/live/live.eduviskar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.eduviskar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

